name: Release

on:
  push:
    tags: ["v*"]
  # 手動起動。2026-08-07、v0.1.9 のタグを push しても (2回試しても) 実行が1件も
  # 作られない事象が起きた ―― タグはリモートに存在し、この workflow もタグ時点に
  # 同じトリガーで存在し、リポジトリの Actions も有効だった。原因は特定できて
  # いないが、タグ経由が詰まったときにリリースを出す手段が他に無いと詰むので
  # 逃げ道を用意する。既存のタグを選んで走らせる。
  #
  # 入力は**あえて持たない**。GitHub の手動実行では実行対象の ref (タグも選べる) を
  # UI/CLI 側で指定でき、checkout も tauri-action もその ref を見るため、タグ名を
  # 入力として受け取る必要が無い。受け取ると checkout の `ref:` に外部入力が流れる
  # 形になり、ref インジェクションの経路を自分で作ることになる。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # リリース(タグに対応する空のリリース)を、ビルドの前に 1 つだけ作る。
  # macOS と Windows のジョブを並行に走らせるとき、tauri-action が同じタグのリリースを
  # 同時に作ろうとして競合するのを避けるため。ビルドのジョブは、tauri-action が
  # 既存のリリース(タグ名で探す)へ成果物を足すだけになる。本文もここで一度だけ書く。
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 再実行・手動実行で、既にあるときは何もしない
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "release $TAG_NAME は既にあります"
            exit 0
          fi
          cat > notes.md <<'NOTES'
          **macOS (Homebrew)**
          ```
          brew install --cask love-rox/tap/kichijitsu
          brew upgrade --cask kichijitsu
          ```
          ※ Developer ID で署名し Apple の公証を受けています。

          cask のインストールには GitHub CLI の認証が必要です: `brew install gh && gh auth login`

          **DMG を直接ダウンロードする場合**
          下の `kichijitsu_*_aarch64.dmg` を使用してください(Apple Silicon 専用です)。

          **Windows**
          下の `kichijitsu_*_x64-setup.exe`(または `.msi`)を使用してください。
          ※ 現時点ではコード署名をしていないため、初回は SmartScreen の警告が出ます
          (「詳細情報」→「実行」)。
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG_NAME" --verify-tag --title "kichijitsu $TAG_NAME" --notes-file notes.md

  build:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # secret が欠けると tauri は署名を黙って飛ばし、無署名の DMG をそのままリリースしてしまう。
      # 「署名したつもりで未署名」を避けるため、ビルド前に必須 secret の存在を確認する。
      - name: Check Apple signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # アップデータ用の署名鍵。無いと tauri は更新用の成果物(.sig / latest.json)を作らず、
          # 自動アップデートが黙って配られなくなる。パスワードは鍵を無パスワードで作った場合に空。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=0
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY; do
            if [ -z "${!k}" ]; then echo "::error::secrets.$k が未設定です"; missing=1; fi
          done
          exit $missing

      - uses: tauri-apps/tauri-action@v0.6.2
        # 後段の cask 更新が artifactPaths 出力 (アップロードした実ファイルのパス) を
        # 参照するため id を振る。
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application 証明書による署名と Apple の公証 (notarization)。
          # tauri が APPLE_CERTIFICATE から一時キーチェーンを作って署名し、
          # APPLE_ID / APPLE_PASSWORD (App 用パスワード) / APPLE_TEAM_ID で公証・staple まで行う。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 自動アップデート(tauri-plugin-updater)の署名鍵。公開鍵は tauri.conf.json の
          # plugins.updater.pubkey。tauri-action が latest.json もリリースへ上げる。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # ワークスペースなので apps/desktop 直下にロックファイルが無く、tauri-action が
          # パッケージマネージャ検出で npm にフォールバックして `npm run tauri build` を実行し、
          # `tauri` スクリプト不在で失敗する。pnpm に node_modules/.bin/tauri を直接叩かせる。
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "kichijitsu ${{ github.ref_name }}"
          # 容量とビルド時間を減らすため Apple Silicon (aarch64) に絞った。Intel Mac 向けは配布しない。
          args: --target aarch64-apple-darwin

      # 配布物が本当に署名・公証済みか、実ファイルで確かめる。失敗ならリリースを失敗扱いにする。
      - name: Verify signature and notarization
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          dmg=$(jq -er '[.[] | select(endswith(".dmg"))][0]' <<<"$ARTIFACT_PATHS")
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
          trap 'hdiutil detach "$mnt" -quiet' EXIT
          # tauri が公証して staple するのは DMG ではなく中の .app なので、検証対象も .app。
          xcrun stapler validate "$mnt/kichijitsu.app"
          codesign --verify --deep --strict --verbose=2 "$mnt/kichijitsu.app"
          spctl --assess --type execute --verbose=2 "$mnt/kichijitsu.app"

      # 自動アップデートの配信物を確かめる。latest.json が無い・署名が空だと、既存の利用者へ
      # 更新が届かないのにリリースだけ成功して見える。
      - name: Verify updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          gh release download "$TAG_NAME" --pattern latest.json --dir "$dir"
          for platform in darwin-aarch64; do
            jq -e --arg p "$platform" '.platforms[$p] | (.url | length > 0) and (.signature | length > 0)' "$dir/latest.json" >/dev/null \
              || { echo "::error::latest.json の $platform に url / signature がありません"; exit 1; }
          done
          echo "latest.json: version=$(jq -r .version "$dir/latest.json")"

      # Love-Rox/homebrew-tap の Casks/kichijitsu.rb を更新する。
      # 手作業だと忘れたときに「リリースは出ているのに brew では古いまま」という、
      # エラーも出ず原因も分からない状態になる (2026-08-07 の v0.1.9 で実際に発生) ため、
      # DMG を作ったのと同じジョブで更新まで済ませる。
      # ここが黙って落ちると自動化の意味が無いので、失敗は必ずジョブの失敗にする
      # (`set -euo pipefail` + 各所の明示的な die/exit 1)。
      - name: Update Homebrew cask
        env:
          # `${{ }}` を run: の中へ直接展開するとタグ名などの外部入力がシェルスクリプトの
          # ソースとして解釈され、コマンドインジェクションの経路になる。値は必ず env で
          # 環境変数として渡し、スクリプト側では "$VAR" として参照する。
          # https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
          TAG_NAME: ${{ github.ref_name }}
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          # 別リポジトリ (Love-Rox/homebrew-tap) への push なので secrets.GITHUB_TOKEN では
          # 権限が足りない (このリポジトリにしか効かない)。tap 側の contents:write を持つ
          # PAT を別途登録して使う。
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "::error::secrets.TAP_GITHUB_TOKEN が未設定です (tap への push に必要)"
            exit 1
          fi

          # タグは v0.1.9 形式。cask の version は先頭の v を除いたもの。
          # 想定外の ref (ブランチ名など) で走ったときに壊れた cask を push しないよう、
          # ここで形を検証して弾く。
          version="${TAG_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::タグ名が想定の v<x.y.z> 形式ではありません: ${TAG_NAME}"
            exit 1
          fi

          # sha256 は「実際に配布される DMG」から取る必要がある。別物の値を書くと brew が
          # checksum 不一致で失敗し、しかも原因が分かりにくい。
          # tauri-action の artifactPaths はリリースへアップロードした実ファイルのパスなので、
          # これを直接ハッシュすればリリース資産とバイト一致が保証される
          # (再実行時も tauri-action は同名資産を消して貼り直すため、常に最新ビルドと一致)。
          # ファイル名に version が含まれるため、tauri.conf.json のバージョンとタグがずれて
          # いる場合はここでヒットせず落ちる ＝ cask の url が 404 になる事故も同時に防げる。
          dmg_name="kichijitsu_${version}_aarch64.dmg"
          dmg=$(
            DMG_NAME="$dmg_name" jq -er '
              [.[] | select(endswith("/" + env.DMG_NAME))]
              | if length == 1 then .[0]
                else error("\(env.DMG_NAME) に一致する成果物が \(length) 件 (1 件であるべき)")
                end
            ' <<<"$ARTIFACT_PATHS"
          )
          sha256=$(shasum -a 256 "$dmg" | cut -d ' ' -f 1)
          echo "cask 更新: version=${version} sha256=${sha256} (${dmg})"

          git clone --depth 1 \
            "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/Love-Rox/homebrew-tap.git" \
            "${RUNNER_TEMP}/homebrew-tap"
          cd "${RUNNER_TEMP}/homebrew-tap"

          # 更新するのは version と sha256 の2行だけ。url は #{version} から組み立てられるので
          # 触らない。行頭2スペース + キー名でアンカーして、caveats 本文などを巻き込まない。
          # 置換対象が無ければ die させる ― 黙って何もしないと「更新したつもり」で古い
          # cask が残る、まさに避けたい失敗になる。
          VERSION="$version" SHA256="$sha256" perl -0777 -i -pe '
            s/^(  version ")[^"]*(")/$1$ENV{VERSION}$2/m or die "version 行が見つかりません\n";
            s/^(  sha256 ")[^"]*(")/$1$ENV{SHA256}$2/m or die "sha256 行が見つかりません\n";
          ' Casks/kichijitsu.rb

          # 冪等性: 同じバージョンで再実行しても差分が無ければ何もしない。
          # (ビルドし直して sha256 が変わった場合は差分が出るので、その場合は更新される)
          if git diff --quiet; then
            echo "cask は既に version=${version} sha256=${sha256} です。コミットしません。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "kichijitsu ${version}"
          git push

  # Windows 版。macOS のジョブと並行に走る(リリースは create-release が先に作る)。
  # tauri-action が latest.json に自分のプラットフォームの項目を足す(既存の項目は残す)が、
  # 並行だと、同時に書いて片方が消える恐れがある。そのため、最後の verify-manifest ジョブで
  # 両方の項目が揃っているかを確かめる(消えていたら失敗にする。再実行で直る)。
  # コード署名はしていない(証明書が無い)。更新用の署名(TAURI_SIGNING_PRIVATE_KEY)は
  # macOS と同じ鍵で行う。
  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      # 更新用の署名鍵が無いと、更新の成果物(.sig)ができず、Windows だけ自動更新が配られない。
      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secrets.TAURI_SIGNING_PRIVATE_KEY が未設定です"
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "kichijitsu ${{ github.ref_name }}"

      # 配信物の確認。latest.json に Windows の項目(url と署名)が入っていなければ失敗にする。
      # (macOS の項目は並行して作られるので、ここでは見ない。verify-manifest が両方を見る)
      - name: Verify updater manifest (Windows)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          gh release download "$TAG_NAME" --pattern latest.json --dir "$dir"
          jq -e '.platforms["windows-x86_64"] | (.url | length > 0) and (.signature | length > 0)' "$dir/latest.json" >/dev/null \
            || { echo "::error::latest.json の windows-x86_64 に url / signature がありません"; exit 1; }

  # 並行ビルドの後、自動更新の配信物(latest.json)に両方のプラットフォームが揃っているかを確かめる。
  # 同時に書き込んで片方の項目が消えると、既存の利用者へ更新が届かないのに、リリースだけ成功して見える。
  verify-manifest:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify updater manifest (all platforms)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          gh release download "$TAG_NAME" --pattern latest.json --dir "$dir"
          for platform in darwin-aarch64 windows-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p] | (.url | length > 0) and (.signature | length > 0)' "$dir/latest.json" >/dev/null \
              || { echo "::error::latest.json の $platform に url / signature がありません(同時書き込みで消えた可能性。ジョブを再実行してください)"; exit 1; }
          done
          echo "latest.json: version=$(jq -r .version "$dir/latest.json")"
