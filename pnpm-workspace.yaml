packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  # postinstall は寄付のお知らせを出すだけなので動かさない（pnpm 12 は未指定だと install を止める）
  core-js-pure: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.5
  vite-plus: 0.2.5
overrides:
  vite: "catalog:"
  # --- 脆弱性対応のための間接依存の上げ（pnpm audit, 2026-10） ---
  # wrangler>miniflare が undici 7.29.1 に固定している（GHSA-xjj6-f33q-929c ほか）
  undici@^7: ^7.30.1
  # vite-plus>oxfmt が tinypool 2.1.0 に固定している（GHSA-5gmw-xhrv-c9v3 / GHSA-85c8-ppgw-ccpr、critical）
  tinypool@^2: ^2.1.2
  # agents 0.20.1 が peer で @modelcontextprotocol/client 2.0.0 を固定している。同じメジャーの直った版にそろえる
  # （GHSA-6qxp-vccf-f47h / GHSA-6prh-2h8m-c8cw）。sdk・server は apps/sync で直接上げた。agents 0.29 以降はこの版を使う
  "@modelcontextprotocol/client@^2": 2.3.1
  # vite-plus 0.2.x が vitest と @vitest/* を 4.1.10 に固定している。vite-plus 自体の修正版は 1.1.0（メジャー）なので、
  # vitest 側だけ同じメジャーの直った版にそろえる（vitest / @vitest/mocker GHSA-82fw-gwwq-j7x9・GHSA-qxg6-89mg-rqv8）
  vitest@^4: 4.1.12
  "@vitest/browser@^4": 4.1.12
  "@vitest/browser-preview@^4": 4.1.12
  "@vitest/expect@^4": 4.1.12
  "@vitest/mocker@^4": 4.1.12
  "@vitest/pretty-format@^4": 4.1.12
  "@vitest/runner@^4": 4.1.12
  "@vitest/snapshot@^4": 4.1.12
  "@vitest/spy@^4": 4.1.12
  "@vitest/utils@^4": 4.1.12
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
