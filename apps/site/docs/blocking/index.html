        ## このページで説明すること

        1. 何のための機能か — 複数のカレンダーを持っていると起きる多重予約を、
           ミラー予定で塞ぐ。まずこの一段落で用途を伝える。
        2. ルールを作る — 設定 UI の項目 (ソースカレンダー / ミラー先 / タイトル / 不在の扱いなど)。
           保存される項目は migrations 0006・0007 が正。
        3. いつミラーされるか — 実行のきっかけ。反映までの間隔。
        4. 元の予定を変えた・消したときどうなるか — 差分照合の結果として作成 / 更新 / 削除が決まること。
        5. 注意点 — ミラー先の予定を直接いじった場合、ループしない仕組み、消し漏れの扱いなど。
           docs/blocking.md に書かれている制約は落とさないこと。

        ## 参照するソース (パスはリポジトリルート kichijitsu/ からの相対)

        - docs/blocking.md — 機能の設計メモ。仕様の一次資料
        - apps/web/src/components/BlockRulesOverlay.tsx — ルール設定 UI (項目名はここの表記に合わせる)
        - apps/web/src/sync/blockRules.ts (+ .test.ts), apps/web/src/hooks/useBlockRules.ts — ルールの型・検証・保存
        - apps/sync/src/core/block-rules.ts — サーバー側の CRUD と正規化
        - apps/sync/src/core/block-reconcile.ts — 元予定とミラー予定の差分照合 (作成 / 更新 / 削除の決定)
        - apps/sync/src/core/block-orchestrate.ts — ミラー処理がいつ走るか
        - apps/sync/src/core/insert-event.ts — ミラー先への書き込み
        - apps/sync/migrations/0006_block_rules.sql, 0007_block_rule_ooo_fallback.sql — 保存される項目の一覧
