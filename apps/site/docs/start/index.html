        ## このページで説明すること

        1. ログインする — Google アカウントでのログイン。どのスコープを求めるか、
           なぜカレンダーの読み書き権限が要るか。公式インスタンスは招待制である点にも触れる。
        2. 複数の Google アカウントを足す — プライマリと追加アカウントの関係、追加のしかた、
           解除したときに何が消えるか。
        3. 画面の見かた — 上部ツールバー / 左のカレンダー一覧ペイン / 中央のカレンダー /
           右ペイン (GitHub) が何をするところか。設定 (歯車) から何ができるか。
        4. 表示するカレンダーを選ぶ — カレンダー一覧での表示 ON/OFF。
        5. 次にどこを読むか — /docs/calendar/ への送り出し。

        ## 参照するソース (パスはリポジトリルート kichijitsu/ からの相対)

        - apps/sync/src/routes/auth.ts — ログイン / コールバック / ログアウト、アカウント追加のエンドポイント
        - apps/sync/src/accounts.ts — プライマリ / 追加アカウントの登録・一覧・削除
        - apps/web/src/hooks/useGoogleAccounts.ts — フロント側のアカウント追加・解除
        - apps/web/src/components/SettingsModal.tsx — 設定画面。初回に触る項目がここに集まっている
        - apps/web/src/App.tsx — 画面全体の構成。「画面の見かた」の骨格
        - apps/web/src/components/AppToolbar.tsx, toolbarMenuItems.ts — 上部ツールバーの項目一覧
        - apps/web/src/components/CalendarPane.tsx — カレンダー一覧ペイン (表示 ON/OFF)
        - apps/sync/src/session.ts — セッション Cookie (ログイン状態の持続)
        - docs/google-verification.md — OAuth 同意画面と要求スコープ
        - README.md — 全体像

        ## 書きかたの決まり

        - 文体は /mcp/ と /self-hosting/ に合わせる。日本語・常体 (「〜する」「〜だ」)。です・ます調にしない。
