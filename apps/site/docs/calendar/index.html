        ## このページで説明すること

        1. 表示を切り替える — 日 / 週 / 月など、どの表示があり何が違うか。画面が狭いときの制限も。
        2. 予定を作る・編集する — 新規作成、ドラッグでの移動・リサイズ、詳細カードからの編集。
           繰り返し予定を動かしたときの「この予定のみ / これ以降」の分岐は必ず説明すること。
        3. 招待に返事をする (RSVP) — 参加 / 未定 / 不参加。未返信・仮・不参加が見た目でどう違うか。
           不参加にした予定を隠す設定があるならそれも。
        4. 不在 (OOO) — Google の outOfOffice をどう表示するか (端のレール)。
        5. 勤務場所 (working location) — 帯とピンでの表示。
        6. キーボードショートカット — 一覧表。`?` でヘルプが出ることも書く。表は
           <div class="table-scroll"><table> で。

        「こんな画面です」のランディング (apps/site/index.html) の凡例と用語をそろえること
        (今日は枡の朱印 / 勤務場所は帯とピン / 不在はレール / 仮の予定は淡く / 不参加は打ち消し線)。

        ## 参照するソース (パスはリポジトリルート kichijitsu/ からの相対)

        - apps/web/src/layout/viewRange.ts — 日 / 週 / 月など表示モードと期間計算。View 種別の定義元
        - apps/web/src/keyboard/shortcuts.ts (+ shortcuts.test.ts) — ショートカットの全マッピング
        - apps/web/src/components/KeyboardHelpOverlay.tsx — 「?」で出る一覧の表示テキスト。表記をそろえる
        - apps/web/src/components/EventEditForm.tsx, EventDetailCard.tsx — 作成 / 編集フォームと詳細カード (RSVP)
        - apps/web/src/sync/eventCreate.ts, eventEdit.ts, eventPatch.ts, eventRsvp.ts — 作成 / 編集 / 移動 / RSVP
        - apps/web/src/sync/moveConfirm.ts, overridePatch.ts — 繰り返し予定の「この予定のみ / 以降」分岐
        - apps/web/src/layout/oooRail.ts, workingLocationRail.ts, railItems.ts — 不在と勤務場所のレール
        - apps/web/src/components/RailBand.tsx, AllDayBar.tsx — 上記の描画
        - apps/web/src/sync/mapGoogle.ts — Google の eventType (outOfOffice / workingLocation / focusTime) の変換。種別の正
        - apps/web/src/components/WeekGrid.tsx, MonthView.tsx, DayColumn.tsx — 各表示の描画とドラッグ操作
        - apps/web/src/sync/declinedVisibility.ts — 辞退した予定の表示切り替え
        - apps/sync/src/routes/events.ts — サーバー側 API

        ## 書きかたの決まり

        - 文体は /mcp/ と /self-hosting/ に合わせる。日本語・常体 (「〜する」「〜だ」)。です・ます調にしない。

        - 読者は開発者とは限らない。「どこを押すと何が起きるか」を先に書き、実装の理屈は必要な分だけ。
        - **実装を読んで書くこと。挙動を推測で書かない。** 迷ったら書かずに落とす方がよい。
        - 使える意匠 (apps/site/doc-shell.css に定義済み。これ以外を使わない):
