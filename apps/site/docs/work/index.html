        ## このページで説明すること

        1. GitHub をつなぐ — 接続手順。何が読めるようになるか。
        2. 作業キュー — どの issue / PR が、どの区分に入るか (WORK_QUEUE_SECTION_LABELS が正)。
           実行中と待機の分かれかた。
        3. 稼働を記録する — 開始 / 停止、記録中の見えかた、閉じ忘れ (オープン区間) の扱い、手動記録。
        4. グループ化 — issue / PR 単位でのまとまりかたと合計。
        5. 集計を見る・出す — レポート画面とエクスポート形式。
        6. エージェントから記録する — /mcp/ の `log_work_interval` と
           POST /api/work-intervals への導線 (手順の重複は書かず、/mcp/ へリンクする)。

        ## 参照するソース (パスはリポジトリルート kichijitsu/ からの相対)

        - docs/github-integration.md — 連携全体の設計メモ。このページの下敷きとして最重要
        - docs/github-oauth.md — GitHub App 登録と接続手順 (利用者が最初にやること)
        - apps/web/src/sync/workQueue.ts — 作業キューの区分 (WORK_QUEUE_SECTION_LABELS) と実行中 / 待機の分割
        - apps/web/src/components/WorkQueueSection.tsx, GitHubPane.tsx — 作業キュー UI と GitHub ペイン
        - apps/web/src/sync/workLogEntry.ts, openIntervals.ts — 稼働記録の開始 / 停止とオープン区間
        - apps/web/src/sync/workLogGrouping.ts (+ .test.ts) — issue / PR 単位のグループ化と合計
        - apps/web/src/components/TimeReportOverlay.tsx, apps/web/src/sync/reportExport.ts — 集計画面とエクスポート
        - apps/web/src/components/ManualWorkLogForm.tsx, WorkLogHistory.tsx, RunningTimersIndicator.tsx — 手動記録・履歴・記録中表示
        - apps/sync/src/core/work-log.ts, routes/work-logs.ts, routes/work-intervals.ts — サーバー側 API
        - apps/sync/src/core/github-queue.ts — キューの生成元
        - packages/shared/src/work-log.ts — DTO 定義

        ## 書きかたの決まり

        - 文体は /mcp/ と /self-hosting/ に合わせる。日本語・常体 (「〜する」「〜だ」)。です・ます調にしない。
        - 技術用語とコード識別子は原文のまま (例: IndexedDB, refresh token, `list_events`)。
        - 読者は開発者とは限らない。「どこを押すと何が起きるか」を先に書き、実装の理屈は必要な分だけ。
        - **実装を読んで書くこと。挙動を推測で書かない。** 迷ったら書かずに落とす方がよい。
