        ## このページで説明すること

        1. どれを使うか — ブラウザ / PWA / デスクトップ版の違いを 1 表で。
           デスクトップ版が公式インスタンスをリモート読み込みする作りである点は明記すること
           (= アプリを更新しなくても中身は新しくなる)。
        2. デスクトップ版を入れる — Homebrew Cask での導入。トレイ常駐・グローバルショートカット・
           ウィンドウ記憶など、デスクトップ版だけの利点。
        3. PWA を入れる — ブラウザからのインストール。start_url や standalone 表示の話は
           利用者目線の言い換えで。
        4. 更新はどうなるか — Service Worker が何をキャッシュし、いつ新しくなるか。
           /api・/auth は素通し (= キャッシュされない) 点も。
        5. 更新されないとき — 設定画面からのキャッシュ削除の手順。最終手段としての再インストール。

        ## 参照するソース (パスはリポジトリルート kichijitsu/ からの相対)

        - docs/desktop.md — Tauri 版の方針・ビルド・配布
        - docs/multiplatform.md — デスクトップ / モバイル展開の全体方針 (PWA を含む)
        - apps/desktop/src-tauri/tauri.conf.json — ウィンドウ設定と読み込み先 URL。リモート読み込み型の根拠
        - apps/desktop/src-tauri/src/lib.rs — デスクトップ固有コマンド (app_version, gh_api など)
        - apps/desktop/homebrew/kichijitsu.rb — Homebrew Cask による導入手順
        - apps/web/public/sw.js — Service Worker。キャッシュ名、古いキャッシュの削除、/api・/auth の素通し
        - apps/web/public/manifest.webmanifest — PWA のインストール情報 (start_url, standalone, アイコン)
        - apps/web/src/sync/appCache.ts, apps/web/src/version.ts, apps/web/src/main.tsx — SW 登録・バージョン検出・キャッシュ削除
        - apps/desktop/src-tauri/capabilities/remote.json — リモートオリジンに許可する権限

        ## 書きかたの決まり

        - 文体は /mcp/ と /self-hosting/ に合わせる。日本語・常体 (「〜する」「〜だ」)。です・ます調にしない。

        - 読者は開発者とは限らない。「どこを押すと何が起きるか」を先に書き、実装の理屈は必要な分だけ。
        - **実装を読んで書くこと。挙動を推測で書かない。** 迷ったら書かずに落とす方がよい。
        - 使える意匠 (apps/site/doc-shell.css に定義済み。これ以外を使わない):
