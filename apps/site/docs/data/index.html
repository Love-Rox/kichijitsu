        ## このページで説明すること

        1. 原則 — 予定の正本は Google にあり、kichijitsu はその複製を手元に置く。
           サーバーは予定を永続化しない (/mcp/ の read-through 原則と用語をそろえること)。
        2. ブラウザに入るもの — IndexedDB (DB 名と各ストアが何を持つか) と localStorage (UI 設定)。
           ストアの一覧は apps/web/src/db/database.ts が正。
        3. サーバーに入るもの — D1 のテーブルと、Durable Object が持つもの。
           migrations 一式を見て、実際に存在するものだけを書く。
        4. 認可情報の守りかた — refresh token が at-rest 暗号化されていること、鍵の位置づけ。
        5. 消しかた — ブラウザ側のキャッシュ削除 (/docs/apps/ へリンク)、アカウント解除で何が消えるか。
        6. 公式インスタンスとセルフホストの違い — 「誰を信頼することになるか」。
           /self-hosting/ と /docs/operator/ へ送る。

        プライバシーポリシー (apps/web/privacy.html) と食い違う記述を書かないこと。
        食い違いを見つけたら本文で辻褄を合わせず、報告に上げること
        (privacy.html は apps/web 配下なのでこの作業では触らない)。

        ## 参照するソース (パスはリポジトリルート kichijitsu/ からの相対)

        - apps/web/src/db/database.ts — IndexedDB の全ストア定義。「ブラウザに何が入るか」の一次資料
        - apps/sync/migrations/*.sql (0001_init.sql ほか全 11 本) — D1 のテーブル一覧
        - apps/sync/src/durable-object/user-sync-do.ts — ユーザーごとの DO (同期トークン・SSE・DO ストレージ)
        - apps/sync/src/durable-object/profile-hub-do.ts — 複数アカウントを束ねる側の DO
        - apps/sync/src/crypto.ts — refresh token などの暗号化保存方式
        - apps/sync/src/core/sync-token-store.ts — Google 同期トークンの保存場所
        - apps/web/src/layout/localStore.ts — localStorage に置く UI 設定のキー一覧
        - apps/web/src/sync/themePref.ts, apps/web/src/hooks/useHourHeight.ts, apps/web/src/sync/visibleCalendars.ts — 同上
        - apps/sync/wrangler.jsonc — D1 / DO / KV バインディングの全体像
        - docs/self-hosting.md — どこに何が置かれるかの説明
        - apps/web/privacy.html — 現行のプライバシー記述 (整合をとる相手。編集はしない)
