        ## このページで説明すること

        1. なぜ差し替えるのか — 同梱の規約・ポリシーは公式インスタンスのものを**ひな形として**
           付けているだけで、あなたのインスタンスの運営者はあなた。法的な責任の所在も。
        2. 3 つの環境変数 — KICHIJITSU_OPERATOR_NAME / _CONTACT / _HOST。
           それぞれ規約・ポリシーのどこに出るか。ビルド時に差し込まれること。
        3. 未設定のままだとどうなるか — フォールバック文言。公式 (love-rox) の名前が
           あなたのインスタンスに出ることは無い、という保証を明示する。
        4. 内容そのものを書き換える — テンプレート (apps/web/terms.html, privacy.html) の位置と
           プレースホルダの形。差し替えても壊れない書き方。
        5. この紹介サイトはあなたのインスタンスに入らない — apps/site の成果物は
           `pnpm build` には含まれない。あなたのドメインで配信される 4 つのパスの表。

        /self-hosting/ の「3. 設定を自分の環境に合わせる」に同じ話の要約が既にある。
        **同じ文章を二度書かない。** あちらは手順の一部として短く、こちらは掘り下げて書き、
        相互にリンクする。あちらの表現 (用語・変数名の書き方) にそろえること。

        ## 参照するソース (パスはリポジトリルート kichijitsu/ からの相対)

        - apps/web/build/legalText.ts — 中核。OPERATOR_ENV_KEYS から日英の運営者文言を生成する
        - apps/web/build/legalText.test.ts — 未設定時のフォールバック文言など、期待挙動の具体例
        - apps/web/vite.config.ts — ビルド時に terms.html / privacy.html へ差し込む仕組みと未設定時の警告
        - apps/web/terms.html, apps/web/privacy.html — 差し込み先のテンプレートとプレースホルダの位置
        - apps/web/wrangler.jsonc — assets Worker の設定 (dist を丸ごと配信する = 同居の危険)
        - apps/site/vite.config.ts — 紹介サイトを apps/web から切り離した理由 (冒頭コメント)
        - apps/site/self-hosting/index.html — 既存の要約。重複を避けるために必ず読むこと
        - docs/self-hosting.md, docs/deploy.md — セルフホスト手順と本番デプロイ時の環境変数投入
