<!doctype html>
<!--
  ルート (/) の最小ページ。

  **公式ビルド (`pnpm build:official`) では、このファイルは apps/site のランディングで
  上書きされる。** 公式インスタンスで実際に見えるのは apps/site/index.html の方であり、
  ここを編集しても公式の見た目は変わらない (合流の仕組みはルート package.json と
  apps/site/vite.config.ts のコメント参照)。

  ではなぜ必要か: 紹介サイトを apps/site に切り出した (2026-07-26) ことで、セルフホストが
  叩く素の `pnpm build` の dist には index.html が1つも無くなる。ところが
  apps/web/wrangler.jsonc の not_found_handling は "single-page-application" =
  「未知のパスには dist/index.html を返す」設定なので、これが欠けると未知パスの挙動が
  変わってしまう。そこで「/app/ へ誘導するだけ」の中立なページを置いている。
  他人のプロダクト紹介を載せないという分離の目的は保ったまま、`/` を開いた人が
  アプリに辿り着けるようにするのが役目。

  自動リダイレクト (meta refresh 等) にしていないのは、not_found_handling の対象である
  「打ち間違えた URL」まで黙って /app/ へ飛ばされ、ユーザーが 404 に気づけなくなるため。

  UI は現状日本語のみ (docs/i18n.md 参照、アプリ本体 apps/web/app/index.html と同じ方針)。
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kichijitsu</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAF7F2" />
    <!-- 紹介サイトではないので検索結果には出さない (セルフホスト先のドメインで
         中身のないページが拾われても誰の得にもならない)。 -->
    <meta name="robots" content="noindex" />
    <style>
      /* 依存を持たない自己完結スタイル。色は brand/README.md のトークンに合わせた値。 */
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 24px;
        padding: 24px;
        box-sizing: border-box;
        background: #faf7f2;
        color: #24211e;
        font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        line-height: 1.9;
      }
      main {
        text-align: center;
        max-width: 30rem;
      }
      .wordmark {
        display: block;
        width: 180px;
        max-width: 60vw;
        height: auto;
        margin: 0 auto 20px;
      }
      p {
        font-size: 14px;
        margin: 0 0 28px;
      }
      .btn {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 999px;
        background: #c13625;
        color: #faf7f2;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
      }
      .btn:focus-visible {
        outline: 2px solid #24211e;
        outline-offset: 3px;
      }
      .links {
        margin: 32px 0 0;
        padding: 0;
        list-style: none;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 4px 20px;
        font-size: 12px;
      }
      .links a {
        color: #8a8478;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="wordmark" src="/wordmark.svg?v=1" alt="kichijitsu" />
      <p>ローカルファーストなカレンダークライアント。</p>
      <a class="btn" href="/app/">アプリを開く</a>
      <ul class="links">
        <li><a href="/privacy.html">プライバシー</a></li>
        <li><a href="/terms.html">規約</a></li>
        <li>
          <a href="https://github.com/Love-Rox/kichijitsu" target="_blank" rel="noopener noreferrer"
            >GitHub</a
          >
        </li>
      </ul>
    </main>
  </body>
</html>
